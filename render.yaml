# Kostenloses Render-Webhosting. Die Datenbank muss extern bestehen bleiben (z. B. Neon Free).
# Keine persistente Disk und kein kostenpflichtiger Tarif.
services:
  - type: web
    name: banana-cup-central
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /healthz
    envVars:
      - key: REQUIRE_PERSISTENT_DB
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false